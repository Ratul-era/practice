<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navigation bar</title>
<style>
  :root {
    --gold: #ecd49a;
    --gold-bright: #fff0c4;
    --bar-bg: linear-gradient(180deg, #232a35 0%, #151a22 100%);
    --bar-border: rgba(170, 190, 215, 0.45);
    --page-bg: #3b3f46;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 32px;
    background: var(--page-bg);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }

  .nav {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: var(--bar-bg);
    border: 1px solid var(--bar-border);
    border-radius: 999px;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.08),
      0 0 0 3px rgba(20, 24, 31, 0.55),
      0 8px 24px rgba(0, 0, 0, 0.35);
  }

  .nav a,
  .nav button {
    appearance: none;
    background: none;
    border: 0;
    margin: 0;
    padding: 10px 14px;
    border-radius: 999px;
    font: inherit;
    font-size: 14px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--gold);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: color 0.2s, background-color 0.2s;
  }

  .nav a:hover,
  .nav button:hover,
  .nav [aria-expanded="true"] {
    color: var(--gold-bright);
    background: rgba(236, 212, 154, 0.1);
  }

  .nav a:focus-visible,
  .nav button:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  /* Dropdown caret */
  .caret {
    width: 0;
    height: 0;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 5px solid currentColor;
    transition: transform 0.2s;
  }
  [aria-expanded="true"] .caret { transform: rotate(180deg); }

  /* Dropdown */
  .dropdown { position: relative; }

  .menu {
    position: absolute;
    top: calc(100% + 14px);
    left: 50%;
    transform: translateX(-50%);
    min-width: 190px;
    margin: 0;
    padding: 8px;
    list-style: none;
    background: var(--bar-bg);
    border: 1px solid var(--bar-border);
    border-radius: 18px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.18s, visibility 0.18s;
  }
  .menu.open { opacity: 1; visibility: visible; }

  .menu::before {
    content: "";
    position: absolute;
    bottom: 100%;
    left: 0;
    right: 0;
    height: 14px;
  }

  .menu a {
    display: flex;
    width: 100%;
    border-radius: 12px;
    font-size: 13px;
  }

  @media (max-width: 420px) {
    .nav a, .nav button { padding: 9px 10px; font-size: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<nav class="nav" aria-label="Main">
  <a href="/">Home</a>
  <a href="/resume">Resume</a>

  <div class="dropdown">
    <button type="button" aria-expanded="false" aria-controls="projects-menu" id="projects-btn">
      <a href="#projects">Projects</a> <span class="caret" aria-hidden="true"></span>
    </button>
    <ul class="menu" id="projects-menu">
      <li><a href="/projects/project-one">Project one</a></li>
      <li><a href="/projects/project-two">Project two</a></li>
      <li><a href="/projects/project-three">Project three</a></li>
    </ul>
  </div>

  <a href="#contact">Contact</a>
</nav>

<script>
  const btn = document.getElementById('projects-btn');
  const menu = document.getElementById('projects-menu');
  const dropdown = btn.closest('.dropdown');

  function setOpen(open) {
    btn.setAttribute('aria-expanded', String(open));
    menu.classList.toggle('open', open);
  }

  dropdown.addEventListener('mouseenter', () => setOpen(true));
  dropdown.addEventListener('mouseleave', () => setOpen(false));

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    setOpen(btn.getAttribute('aria-expanded') !== 'true');
  });

  document.addEventListener('click', () => setOpen(false));

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { setOpen(false); btn.focus(); }
  });
</script>

</body>
</html>
